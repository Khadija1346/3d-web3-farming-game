name: GARRIVERSE validation

on:
  push:
    branches:
      - feature/garri-backend-foundation
  pull_request:
    branches:
      - main

jobs:
  build-and-bundle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle Netlify Functions
        run: npx --yes esbuild@0.25.0 netlify/functions/*.mts --bundle --platform=node --format=esm --outdir=/tmp/garriverse-functions
      - name: Test authenticated API input guards
        env:
          GARRIVERSE_FUNCTION_BUNDLE_DIR: /tmp/garriverse-functions
        run: node --test tests/*.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply migrations against PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/supabase-test-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_authoritative_farming_actions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_authoritative_factory_warehouse_market.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_authoritative_tanker_actions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_server_quests_and_claims.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_server_quests_and_claims.sql
      - name: Test authoritative farming RPC
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/garriverse-migrations.test.sql
